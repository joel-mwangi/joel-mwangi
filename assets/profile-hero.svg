<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Custom technology profile hero background">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="55%" stop-color="#0b1830"/>
    <stop offset="100%" stop-color="#10243a"/>
  </linearGradient>
  <radialGradient id="glow1" cx="20%" cy="25%" r="65%">
    <stop offset="0%" stop-color="#1683ff" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#1683ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="82%" cy="62%" r="55%">
    <stop offset="0%" stop-color="#15c8b5" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#15c8b5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffd166" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#f4a261" stop-opacity="0.15"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#7aa8d8" stroke-opacity="0.06"/>
  </pattern>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#glow1)"/>
<rect width="1200" height="420" rx="28" fill="url(#glow2)"/>
<rect x="1" y="1" width="1198" height="418" rx="27" fill="url(#grid)" stroke="#55a7ff" stroke-opacity="0.2"/>

